<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESL Kids Network</title>
    <style>
        /* A little CSS to make it look like a grid of cards */
        .network { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { border: 2px solid #333; padding: 15px; border-radius: 10px; width: 200px; text-align: center; }
        .card.green { background-color: #d4edda; } /* Example color coding */
        .card.red { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>Welcome to the ESL Class Network!</h1>
    <div id="profiles-container" class="network"></div>

    <script src="app.js"></script>
</body>
</html>
