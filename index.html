<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESL Kids Network</title>
    <style>
        /* Password Modal Styling */
        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
        }
        #password-box {
            border: 2px solid #333; padding: 30px;
            border-radius: 10px; background: #f9f9f9;
            text-align: center;
        }

        /* Hide main site by default */
        #main-content { display: none; }
        
        /* A little CSS to make it look like a grid of cards */
        .network { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { border: 2px solid #333; padding: 15px; border-radius: 10px; width: 200px; text-align: center; }
        .class-section {
        border: 2px dashed #ccc;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 40px;
        background-color: #f9f9f9;
        }

        .class-title {
        font-size: 1.5rem;
        margin-top: 0;
        color: #333;
        }

        .card-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        }

        .class-section {
        border: 2px dashed #ccc;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 40px;
        background-color: #f9f9f9;
        }

        .class-title {
        font-size: 1.5rem;
        margin-top: 0;
        color: #333;
        }

    </style>
</head>
<body>
    <!-- Password Screen -->
    <div id="password-overlay">
        <div id="password-box">
            <h2>ESL Class Portal</h2>
            <p>Please enter the class password:</p>
            <input type="password" id="pass-input" placeholder="Password">
            <button onclick="checkPassword()">Enter</button>
            <p id="error-msg" style="color: red; display: none;">Incorrect password!</p>
        </div>
    </div>

    <!-- Protected Main Content -->
        <div id="main-content">
        <h1>The Big Question</h1>
        <div id="profiles-container" class="network"></div>
        </div>
        <script src="app.js"></script>
</body>
</html>
